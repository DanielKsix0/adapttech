<style>
:root{--bg:#0d1511;--card:#1c2a23;--line:#2c3d34;--tx:#f1f5f2;--mute:#9db0a5;--ac:#3a8a45;--ac2:#6fdc8c;--bad:#e8776b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f1f6f2;--card:#fff;--line:#cfdcd3;--tx:#14211a;--mute:#5a6e62;--ac:#2f7a3b;--ac2:#1d7a3a;--bad:#c0392b;color-scheme:light}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:30px;letter-spacing:.5px}
.sub{color:var(--mute);font-size:14px;margin:2px 0 14px}
.badge{background:rgba(58,138,69,.25);color:var(--ac2);border-radius:99px;padding:4px 12px;font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
nav button,.seg button{font:inherit;color:var(--tx);background:none;border:1px solid var(--line);border-radius:99px;padding:8px 16px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
h2{font-size:22px;margin:22px 0 4px}
h3{font-size:17px;margin:20px 0 8px}
p.m{color:var(--mute);margin:4px 0 12px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.card .l{color:var(--mute);font-size:13px}
.card .v{font-size:22px;font-weight:700;margin-top:4px}
.pos{color:var(--ac2)}.neg{color:var(--bad)}
label{display:block;margin:14px 0 6px;font-size:15px}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:12px 16px;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;font:inherit;font-weight:600;color:#fff;background:var(--ac);border:0;border-radius:99px;padding:14px;margin-top:16px}
.btn.s{display:inline-block;width:auto;padding:8px 14px;margin:8px 8px 0 0;font-size:14px}
.btn.o{background:none;border:1px solid var(--line);color:var(--tx)}
.btn.d{background:none;border:1px solid var(--bad);color:var(--bad)}
.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:99px;margin:12px 0}
.seg button{flex:1;border:0;padding:10px 4px}
.seg button.on{background:var(--bg);font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.empty{text-align:center;padding:22px 10px;color:var(--mute)}
.low{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:9}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--ac2);border-radius:99px;transition:width .7s ease}
.btn,nav button,.seg button{transition:transform .12s}.btn:active,nav button:active,.seg button:active{transform:scale(.96)}
#app.in{animation:fade .3s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
#app.in .card{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}#app.in .card:nth-child(2){animation-delay:.06s}#app.in .card:nth-child(3){animation-delay:.12s}#app.in .card:nth-child(4){animation-delay:.18s}#app.in .card:nth-child(5){animation-delay:.24s}#app.in .card:nth-child(6){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.bump{animation:bump .8s ease}@keyframes bump{0%{box-shadow:0 0 0 0 var(--ac2)}30%{transform:scale(1.04);box-shadow:0 0 0 3px var(--ac2)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
.toast{animation:toastin .3s cubic-bezier(.2,.8,.2,1)}@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translateX(-50%)}}
nav button,.seg button{transition:transform .12s,background .25s,border-color .25s}
@media (prefers-reduced-motion:reduce){#app.in .card,.bump,.toast{animation:none}}
@media (prefers-reduced-motion:reduce){#app.in{animation:none}.bar i,.btn,nav button,.seg button{transition:none}}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;animation:fade .2s}.mod .box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:380px;max-height:90%;overflow:auto}.mod p{margin:0 0 12px;white-space:pre-wrap}.mod textarea{width:100%;height:140px;font:13px monospace;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}.mod .btn{margin-top:10px}.mod .acts{display:flex;gap:8px}
.pick{cursor:pointer;border:2px solid transparent;transition:border-color .2s,transform .12s}.pick:active{transform:scale(.98)}.pick.sel{border-color:var(--ac2)}
.step{display:flex;gap:8px}.step button{flex:none;width:50px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;font:inherit;font-size:22px}.step input{text-align:center}
.okc{border:2px solid var(--ac2);animation:pop .5s cubic-bezier(.2,.8,.2,1)}
.ban{position:fixed;left:12px;right:12px;max-width:600px;margin:0 auto;top:calc(10px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--ac2);border-radius:18px;padding:12px 16px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:banin .4s cubic-bezier(.2,.8,.2,1)}.ban b{display:block;margin-bottom:2px}@keyframes banin{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ban{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>ADAPT TECH</h1><span class="badge" id="sync">Ativo</span></header>
<div class="sub">Gest&#227;o comercial</div>
<nav id="nav"></nav>
<main id="app"></main>
</div>
<script>
const KEY='adapttech_v1';
const $=s=>document.querySelector(s);
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{v=String(v||'').trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fdate=d=>d.split('-').reverse().join('/');
let db={products:[],sales:[],expenses:[],buys:[]};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.products)db=x}catch(e){}
db.cash=db.cash||[];db.meta=db.meta||0;
const localSave=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const save=()=>{db.ts=Date.now();localSave();push()};
const S={tab:'inicio',et:'variavel',ef:'todas',ct:'aporte',cf:'todas',per:'mes',mes:today().slice(0,7),dia:today()};
const TABS=[['inicio','In\u00edcio'],['cadastrar','Cadastrar'],['produtos','Produtos'],['vender','Vender'],['despesas','Despesas'],['relatorios','Relat\u00f3rios'],['caixa','Caixa']];
const CATS=['Eletr\u00f4nicos','Celulares','Acess\u00f3rios','Games','Pe\u00e7as','Outros'];
const go=t=>{S.tab=t;render(1);window.scrollTo(0,0)};
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)};
const val=id=>$('#'+id).value;

// \u00edcone para a tela inicial
(()=>{try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0d1511';x.fillRect(0,0,180,180);x.fillStyle='#3a8a45';x.beginPath();x.arc(90,90,62,0,7);x.fill();x.fillStyle='#fff';x.font='bold 54px -apple-system,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('AT',90,94);$('#icon').href=c.toDataURL('image/png')}catch(e){}})();

const rev=s=>s.qty*s.price, cmv=s=>s.qty*s.cost;
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
function totals(sales,exps){const f=sum(sales,rev),c=sum(sales,cmv),t=sum(sales,s=>s.fee),d=sum(exps,e=>e.value);return{fat:f,cmv:c,bruto:f-c,taxas:t,desp:d,liq:f-c-t-d,un:sum(sales,s=>s.qty)}}

const views={
inicio(){
  const T=totals(db.sales,db.expenses),P=db.products;
  const low=P.filter(p=>p.stock<=p.min);
  return `<h2>Vis\u00e3o geral</h2><p class="m">Resumo geral da opera\u00e7\u00e3o.</p>
  <div class="grid">
  <div class="card"><div class="l">Faturamento total</div><div class="v">${brl(T.fat)}</div></div>
  <div class="card"><div class="l">Lucro l\u00edquido geral</div><div class="v ${T.liq<0?'neg':'pos'}">${brl(T.liq)}</div></div>
  <div class="card"><div class="l">Produtos cadastrados</div><div class="v">${P.length}</div></div>
  <div class="card"><div class="l">Unidades em estoque</div><div class="v">${sum(P,p=>p.stock)}</div></div>
  <div class="card"><div class="l">Unidades vendidas</div><div class="v">${T.un}</div></div>
  <div class="card"><div class="l">Investimento em estoque</div><div class="v">${brl(sum(P,p=>p.stock*p.cost))}</div></div></div>
  ${metaCard()}${notifCard()}<div class="card"><h3 style="margin-top:0">Aten\u00e7\u00e3o ao estoque</h3>${low.length?low.map(p=>`<div class="row"><span>${esc(p.name)}</span><span class="low">${p.stock} un. (m\u00edn. ${p.min})</span></div>`).join(''):'<span class="pos">Todos os produtos est\u00e3o acima do estoque m\u00ednimo.</span>'}</div>
  <button class="btn" onclick="go('relatorios')">Abrir relat\u00f3rios</button>`},
cadastrar(){
  return `<h2>Cadastrar produto</h2><p class="m">Informe a data em que o produto entrou no estoque. O custo unit\u00e1rio deve incluir frete e taxas da compra.</p>
  <label>Nome do produto</label><input id="pn" placeholder="Ex.: Controle de PS4">
  <label>Categoria</label><select id="pc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>

function render(anim){
  $('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
  $('#app').innerHTML=views[S.tab]();
  if(anim){const a=$('#app');a.classList.remove('in');void a.offsetWidth;a.classList.add('in')}
  countUp(!!anim);animateBars(!!anim)
  if(S.tab==='vender')fillPrice();
}
function fillPrice(){const s=$('#vp');if(!s)return;const p=db.products.find(x=>x.id==s.value);if(p)$('#vv').value=String(p.price).replace('.',',')}
function addProduct(){
  const name=val('pn').trim(),cost=num(val('pk')),price=num(val('pp')),qty=parseInt(val('pq'))||0,min=parseInt(val('pm'))||0;
  if(!name)return toast('Informe o nome do produto');
  if(qty<1)return toast('Informe a quantidade comprada');
  const p={id:Date.now(),name,cat:val('pc'),cost,price,stock:qty,min,date:val('pd')||today()};
  db.products.push(p);db.buys.push({id:p.id,date:p.date,desc:'Compra: '+name,value:cost*qty});
  save();toast('Produto salvo');go('produtos');
}
function restock(id){
  const p=db.products.find(x=>x.id===id),q=parseInt(prompt('Quantas unidades de "'+p.name+'" entraram?','1'))||0;
  if(q<1)return;p.stock+=q;db.buys.push({id:Date.now(),date:today(),desc:'Reposi\u00e7\u00e3o: '+p.name,value:p.cost*q});save();toast('Estoque atualizado');render();
}
function delProduct(id){if(!confirm('Excluir este produto? As vendas j\u00e1 registradas continuam nos relat\u00f3rios.'))return;db.products=db.products.filter(p=>p.id!==id);save();render()}
function addSale(){
  const p=db.products.find(x=>x.id==val('vp')),q=parseInt(val('vq'))||0;
  if(!p||q<1)return toast('Informe a quantidade');
  if(q>p.stock)return toast('Estoque insuficiente: s\u00f3 h\u00e1 '+p.stock);
  db.sales.push({id:Date.now(),pid:p.id,name:p.name,qty:q,price:num(val('vv')),cost:p.cost,fee:num(val('vf')),date:val('vd')||today()});
  p.stock-=q;save();toast('Venda registrada');render();
}
function delSale(id){
  if(!confirm('Cancelar esta venda? As unidades voltam ao estoque.'))return;
  const s=db.sales.find(x=>x.id===id),p=db.products.find(x=>x.id===s.pid);if(p)p.stock+=s.qty;
  db.sales=db.sales.filter(x=>x.id!==id);save();render();
}
function addExp(){
  const desc=val('ed').trim(),v=num(val('ev'));

}
function delExp(id){if(!confirm('Excluir esta despesa?'))return;db.expenses=db.expenses.filter(e=>e.id!==id);save();render()}

function restore(){
  const t=prompt('Cole aqui o backup:');if(!t)return;
  try{const x=JSON.parse(t);if(!x.products)throw 0;db=x;db.cash=db.cash||[];db.meta=db.meta||0;save();toast('Backup restaurado');render()}catch(e){toast('Backup inv\u00e1lido')}

function metaCard(){

  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('#app .v').forEach((el,i)=>{
    const t=el.textContent,m=t.includes('R$'),n=m?parseFloat(t.replace(/[^\d,-]/g,'').replace(',','.')):parseInt(t);
    if(!isFinite(n))return;
    const k=S.tab+':'+i,p=PREV[k],changed=p!==undefined&&p!==n,from=changed?p:(fresh?0:n);
    PREV[k]=n;
    if(rm||from===n)return;
    if(changed){const c=el.closest('.card');if(c){c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}}
    const t0=performance.now(),dur=changed?900:600;
    (function f(now){const q=Math.min(1,(now-t0)/dur),x=from+(n-from)*(1-Math.pow(1-q,3));el.textContent=q<1?(m?brl(x):Math.round(x)):t;if(q<1)requestAnimationFrame(f)})(t0);
  });
}
function animateBars(fresh){
  document.querySelectorAll('#app .bar i').forEach((el,i)=>{
    const w=el.style.width,k=S.tab+i,from=fresh&&PB[k]===w?'0%':(PB[k]||(fresh?'0%':w));
    PB[k]=w;if(from===w)return;
    el.style.width=from;requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.width=w}));
  });
}
function setSeg(k,v,el){S[k]=v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));el.classList.add('on')}
function dlg(msg,o={}){return new Promise(res=>{
  const m=document.createElement('div');m.className='mod';
  const done=v=>{m.remove();res(v)};
  let b=`<p>${esc(msg)}</p>`;
  if(o.input)b+=`<input id="dlgi" value="${esc(o.def||'')}" ${o.mode?`inputmode="${o.mode}"`:''}>`;
  if(o.area)b+=`<textarea id="dlgi" ${o.ro?'readonly':''}>${esc(o.def||'')}</textarea>`;
  if(o.choices)b+=o.choices.map(c=>`<button class="btn" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  b+=`<div class="acts"><button class="btn o" data-x="1">${o.choices?'Cancelar':o.ro?'Fechar':'Cancelar'}</button>${(o.choices||o.ro)?'':`<button class="btn ${o.danger?'d':''}" data-ok="1">${o.ok||'OK'}</button>`}</div>`;
  m.innerHTML=`<div class="box">${b}</div>`;
  m.onclick=e=>{const t=e.target;if(t===m||t.dataset.x)return done(null);if(t.dataset.c)return done(t.dataset.c);if(t.dataset.ok)return done((o.input||o.area)?document.getElementById('dlgi').value:true)};
  document.body.appendChild(m);
  const i=m.querySelector('#dlgi');if(i){i.focus();if(o.ro)i.select()}
})}
const ask=msg=>dlg(msg,{ok:'Confirmar',danger:1}).then(v=>v===true);
function payBreak(a){const P=['Dinheiro','Pix','Cart\u00e3o'],t=P.map(n=>[n,sum(a.filter(s=>s.pay===n),s=>rev(s)-s.fee)]),o=sum(a.filter(s=>!P.includes(s.pay)),s=>rev(s)-s.fee);if(o)t.push(['Sem informa\u00e7\u00e3o',o]);return `<div class="card">${t.map(([n,v])=>`<div class="row"><span>${n}</span><b>${brl(v)}</b></div>`).join('')}</div>`}
function addSale(){
  const p=db.products.find(x=>x.id==val('vp')),q=parseInt(val('vq'))||0,pr=num(val('vv'));
  if(!p||q<1)return toast('Informe a quantidade');
  if(q>p.stock)return toast('Estoque insuficiente: s\u00f3 h\u00e1 '+p.stock);
  if(pr<=0)return toast('Informe o pre\u00e7o de venda');
  db.sales.push({id:Date.now(),pid:p.id,name:p.name,qty:q,price:pr,cost:p.cost,fee:num(val('vf')),pay:S.pay||'Pix',date:val('vd')||today()});
  p.stock-=q;save();toast('Venda registrada em '+(S.pay||'Pix'));render();
}
async function quickSell(id){const p=db.products.find(x=>x.id===id);if(!p||p.stock<1)return;const m=await dlg('Forma de pagamento da venda de "'+p.name+'":',{choices:['Pix','Dinheiro','Cart\u00e3o']});if(!m)return;db.sales.push({id:Date.now(),pid:p.id,name:p.name,qty:1,price:p.price,cost:p.cost,fee:0,pay:m,date:today()});p.stock--;save();toast('Vendido: '+p.name);render();saleNotify(p.name,1,p.price)}
async function restock(id){const p=db.products.find(x=>x.id===id);if(!p)return;const v=await dlg('Quantas unidades de "'+p.name+'" entraram?',{input:1,def:'1',mode:'numeric',ok:'Repor'});if(v===null)return;const q=parseInt(v)||0;if(q<1)return toast('Quantidade inv\u00e1lida');p.stock+=q;db.buys.push({id:Date.now(),date:today(),desc:'Reposi\u00e7\u00e3o: '+p.name,value:p.cost*q});save();toast('Estoque atualizado');render()}
async function delProduct(id){if(!await ask('Excluir este produto? As vendas j\u00e1 registradas continuam nos relat\u00f3rios.'))return;db.products=db.products.filter(p=>p.id!==id);save();toast('Produto exclu\u00eddo');render()}
async function delSale(id){if(!await ask('Cancelar esta venda? As unidades voltam ao estoque.'))return;const s=db.sales.find(x=>x.id===id);if(!s)return;const p=db.products.find(x=>x.id===s.pid);if(p)p.stock+=s.qty;db.sales=db.sales.filter(x=>x.id!==id);save();toast('Venda cancelada');render()}
async function delExp(id){if(!await ask('Excluir esta despesa?'))return;db.expenses=db.expenses.filter(e=>e.id!==id);save();toast('Despesa exclu\u00edda');render()}
async function delCash(id){if(!await ask('Excluir este lan\u00e7amento?'))return;db.cash=db.cash.filter(c=>c.id!==id);save();toast('Lan\u00e7amento exclu\u00eddo');render()}
async function setMeta(){const v=await dlg('Meta de faturamento do m\u00eas (R$):',{input:1,def:db.meta?String(db.meta).replace('.',','):'',mode:'decimal',ok:'Salvar'});if(v===null)return;db.meta=num(v);save();toast('Meta salva');render()}
async function backup(){const t=JSON.stringify(db);try{await navigator.clipboard.writeText(t);toast('Backup copiado')}catch(e){dlg('Selecione todo o texto, copie e guarde em um lugar seguro (ex.: app Notas).',{area:1,ro:1,def:t})}}
async function restore(){const t=await dlg('Cole aqui o texto do backup. Isso substitui os dados atuais.',{area:1,def:'',ok:'Restaurar'});if(!t)return;try{const x=JSON.parse(t);if(!x.products)throw 0;db=x;db.cash=db.cash||[];db.meta=db.meta||0;save();toast('Backup restaurado');render()}catch(e){toast('Backup inv\u00e1lido')}}
views.vender=function(){
  const P=db.products,av=P.filter(p=>p.stock>0);
  if(S.sel&&!av.find(p=>p.id===S.sel))S.sel=null;
  const sel=av.find(p=>p.id===S.sel),d=S.done;S.done=null;
  const pay=S.pay||'Pix',sales=[...db.sales].reverse();
  const B=m=>`<button class="${pay===m?'on':''}" onclick="setPay('${m}',this)">${m}</button>`;
  let h='<h2>Nova venda</h2>';
  if(d)h+=`<div class="card okc"><b class="pos">Venda registrada</b><div>${d.q}\u00d7 ${esc(d.name)} \u00b7 ${d.pay}</div><div class="v">${brl(d.total)}</div></div>`;
  if(!P.length)h+='<div class="card empty">Voc\u00ea ainda n\u00e3o tem produtos cadastrados. Cadastre os produtos na aba <b>Cadastrar</b>; depois \u00e9 s\u00f3 voltar aqui para vender.</div>';
  else if(!av.length)h+='<div class="card empty">Todos os produtos est\u00e3o sem estoque. Reponha o estoque na aba <b>Produtos</b>.</div>';
  else{
    h+=`<p class="m">1. Escolha o produto vendido</p><input id="vs" placeholder="Buscar produto..." oninput="filterProd(this.value)">
    <div id="plist" style="margin-top:10px;max-height:270px;overflow-y:auto">${av.map(p=>`<div class="card pick ${p.id===S.sel?'sel':''}" data-n="${esc(p.name.toLowerCase())}" onclick="pickProd(${p.id})"><div class="row" style="border:0;padding:0"><b>${esc(p.name)}</b><b>${brl(p.price)}</b></div><div style="color:var(--mute);font-size:13px">${p.stock} em estoque \u00b7 ${esc(p.cat)}</div></div>`).join('')}</div>`;
    if(sel)h+=`<div id="sf"><p class="m" style="margin-top:22px">2. Quantidade e pre\u00e7o</p>
    <div class="two"><div><label style="margin-top:0">Quantidade</label><div class="step"><button onclick="stepQty(-1)">\u2212</button><input id="vq" type="number" inputmode="numeric" min="1" max="${sel.stock}" value="1" oninput="calc()"><button onclick="stepQty(1)">+</button></div></div>
    <div><label style="margin-top:0">Pre\u00e7o unit\u00e1rio (R$)</label><input id="vv" inputmode="decimal" value="${String(sel.price).replace('.',',')}" oninput="calc()"></div></div>
    <label>Desconto (R$)</label><input id="vdc" inputmode="decimal" placeholder="0,00" oninput="calc()">
    <p class="m" style="margin-top:22px">3. Como o cliente pagou?</p><div class="seg">${B('Pix')}${B('Dinheiro')}${B('Cart\u00e3o')}</div>
    <div id="rate" style="display:${pay==='Cart\u00e3o'?'block':'none'}"><label>Taxa da maquininha (%)</label><input id="vr" inputmode="decimal" value="${String(db.rate||0).replace('.',',')}" oninput="calc()"></div>
    <label>Data da venda</label><input id="vd" type="date" value="${today()}">
    <div class="card" id="sum" style="margin-top:16px"></div>
    <button class="btn" id="vgo" onclick="addSale()">Finalizar venda</button></div>`;
  }
  h+=`<h3>Vendas registradas</h3>${sales.length?sales.slice(0,30).map(s=>`<div class="row"><div><b>${esc(s.name)}</b><div style="color:var(--mute);font-size:13px">${s.qty} un. \u00b7 ${s.pay||'\u2014'} \u00b7 ${fdate(s.date)}</div><a href="#" style="color:var(--bad);font-size:13px" onclick="delSale(${s.id});return false">Cancelar venda</a></div><b>${brl(rev(s))}</b></div>`).join(''):'<p class="m">Nenhuma venda registrada.</p>'}`;
  return h;
};
function saleCalc(){const p=db.products.find(x=>x.id===S.sel);if(!p||!$('#vq'))return null;const q=Math.max(0,parseInt(val('vq'))||0),pr=num(val('vv')),dc=num(val('vdc')),sub=q*pr,total=Math.max(0,sub-dc),rate=(S.pay||'Pix')==='Cart\u00e3o'?num(val('vr')):0,fee=Math.round(total*rate)/100,net=total-fee;return{p,q,pr,dc,sub,total,rate,fee,net,lucro:net-q*p.cost}}
function calc(){const c=saleCalc();if(!c)return;$('#sum').innerHTML=`<div class="row"><span>Subtotal</span><b>${brl(c.sub)}</b></div>${c.dc?`<div class="row"><span>Desconto</span><b class="neg">\u2212${brl(c.dc)}</b></div>`:''}<div class="row"><span>Total da venda</span><b style="font-size:20px">${brl(c.total)}</b></div>${c.fee?`<div class="row"><span>Taxa (${c.rate}%)</span><b class="neg">\u2212${brl(c.fee)}</b></div>`:''}<div class="row"><span>Voc\u00ea recebe</span><b>${brl(c.net)}</b></div><div class="row"><span>Lucro estimado</span><b class="${c.lucro<0?'neg':'pos'}">${brl(c.lucro)}</b></div>`;$('#vgo').textContent='Finalizar venda \u00b7 '+brl(c.total)}
function fillPrice(){calc()}
function pickProd(id){S.sel=id;S.pay=S.pay||'Pix';render();setTimeout(()=>{const f=$('#sf');if(f)f.scrollIntoView({behavior:'smooth',block:'start'})},60)}
function filterProd(q){q=q.toLowerCase();document.querySelectorAll('#plist .pick').forEach(e=>e.style.display=e.dataset.n.includes(q)?'':'none')}
function stepQty(d){const p=db.products.find(x=>x.id===S.sel),i=$('#vq');if(!p||!i)return;i.value=Math.max(1,Math.min(p.stock,(parseInt(i.value)||1)+d));calc()}
function setPay(m,el){S.pay=m;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));el.classList.add('on');$('#rate').style.display=m==='Cart\u00e3o'?'block':'none';calc()}
function addSale(){
  const c=saleCalc();if(!c)return toast('Escolha um produto');
  if(c.q<1)return toast('Informe a quantidade');
  if(c.q>c.p.stock)return toast('Estoque insuficiente: s\u00f3 h\u00e1 '+c.p.stock);
  if(c.pr<=0||c.total<=0)return toast('Informe o pre\u00e7o de venda');
  const pay=S.pay||'Pix';
  db.sales.push({id:Date.now(),pid:c.p.id,name:c.p.name,qty:c.q,price:c.total/c.q,cost:c.p.cost,fee:c.fee,pay,disc:c.dc,date:val('vd')||today()});
  if(c.rate)db.rate=c.rate;
  c.p.stock-=c.q;S.sel=null;S.done={name:c.p.name,q:c.q,total:c.total,pay};save();render();window.scrollTo(0,0);saleNotify(c.p.name,c.q,c.total);
}
let SY=null,syncT=null;
function setSync(st){const e=$('#sync');if(!e)return;const ok=st==='ok';e.textContent=ok?'Sincronizado':st==='err'?'Erro ao sincronizar':'Salvo no aparelho';e.style.background=st==='err'?'rgba(232,119,107,.2)':'';e.style.color=st==='err'?'var(--bad)':''}
function hasData(){return db.products.length||db.sales.length||db.expenses.length||db.cash.length||db.buys.length}
function push(){
  if(!SY)return;clearTimeout(syncT);
  syncT=setTimeout(async()=>{try{const r=JSON.parse(JSON.stringify(db)),s=r.sales;delete r.sales;await SY.d.doc(SY.base+'main').set(r);await SY.d.doc(SY.base+'sales').set({items:s,ts:db.ts});setSync('ok')}catch(e){setSync('err')}},500);
}
async function initSync(){
  try{
    if(typeof claude==='undefined'||!claude.use)return setSync('local');
    const [u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!u||!d)return setSync('local');
    const uid=await u.id();if(!uid)return setSync('local');
    const base='data/users/'+uid+'/';
    const [m,s]=await Promise.all([d.doc(base+'main').get(),d.doc(base+'sales').get()]);
    const rts=m.exists?(m.data().ts||0):0;
    SY={d,base};
    if(m.exists&&rts>(db.ts||0)){const r=m.data();db={products:r.products||[],expenses:r.expenses||[],buys:r.buys||[],cash:r.cash||[],meta:r.meta||0,rate:r.rate||0,sales:s.exists?(s.data().items||[]):[],ts:rts};localSave();render()}
    else if(hasData()&&(db.ts||0)>rts)push();
    setSync('ok');
  }catch(e){SY=null;setSync('local')}
}
function editProduct(id){
  const p=db.products.find(x=>x.id===id);if(!p)return;
  const m=document.createElement('div');m.className='mod';
  m.innerHTML=`<div class="box"><p><b>Editar produto</b></p>
  <label style="margin-top:0">Nome</label><input id="en" value="${esc(p.name)}">
  <label>Categoria</label><select id="ec">${CATS.map(c=>`<option ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select>
  <div class="two"><div><label>Custo (R$)</label><input id="ek" inputmode="decimal" value="${String(p.cost).replace('.',',')}"></div><div><label>Venda (R$)</label><input id="ep" inputmode="decimal" value="${String(p.price).replace('.',',')}"></div></div>
  <div class="two"><div><label>Em estoque</label><input id="es" type="number" inputmode="numeric" value="${p.stock}"></div><div><label>M\u00ednimo</label><input id="em" type="number" inputmode="numeric" value="${p.min}"></div></div>
  <label>Data de entrada</label><input id="ed2" type="date" value="${p.date}">
  <div class="acts"><button class="btn o" data-x="1">Cancelar</button><button class="btn" data-ok="1">Salvar</button></div></div>`;
  m.onclick=e=>{const t=e.target;if(t===m||t.dataset.x)return m.remove();if(t.dataset.ok){const n=val('en').trim();if(!n)return toast('Informe o nome');p.name=n;p.cat=val('ec');p.cost=num(val('ek'));p.price=num(val('ep'));p.stock=Math.max(0,parseInt(val('es'))||0);p.min=Math.max(0,parseInt(val('em'))||0);p.date=val('ed2')||p.date;save();m.remove();toast('Produto atualizado');render()}};
  document.body.appendChild(m);
}
function monthSummary(){const mo=today().slice(0,7),sl=db.sales.filter(s=>s.date.slice(0,7)===mo),ex=db.expenses.filter(e=>e.date.slice(0,7)===mo);return{T:totals(sl,ex),n:sl.length}}
function banner(t,b){const e=document.createElement('div');e.className='ban';e.innerHTML='<b>'+esc(t)+'</b><div>'+esc(b)+'</div>';e.onclick=()=>e.remove();document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}
async function sysNotify(t,b){try{if(!('Notification' in window)||Notification.permission!=='granted')return;const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg&&reg.showNotification)await reg.showNotification(t,{body:b,icon:'icon-192.png',badge:'icon-192.png'});else new Notification(t,{body:b})}catch(e){}}
function notify(t,b){banner(t,b);sysNotify(t,b)}
function saleNotify(name,q,total){if(db.notif===false)return;const T=monthSummary().T;notify('ADAPT TECH','Sua loja teve '+brl(T.bruto)+' em ganhos este m\u00eas.')}
function sendSummary(){const m=monthSummary();notify('ADAPT TECH','Sua loja teve '+brl(m.T.bruto)+' em ganhos este m\u00eas.')}
function toggleNotif(){db.notif=(db.notif===false);save();render()}
async function askNotif(){if(!('Notification' in window))return toast('Este navegador n\u00e3o suporta notifica\u00e7\u00f5es');try{const r=await Notification.requestPermission();toast(r==='granted'?'Notifica\u00e7\u00f5es ativadas':'Permiss\u00e3o negada')}catch(e){toast('N\u00e3o foi poss\u00edvel ativar aqui')}render()}
function notifCard(){const p=(window.self!==window.top)?'framed':(('Notification' in window)?Notification.permission:'unsupported'),off=db.notif===false;return `<div class="card"><div class="l">Notifica\u00e7\u00f5es</div><div class="row" style="border:0"><span>Avisar a cada venda</span><button class="btn s ${off?'o':''}" style="margin:0" onclick="toggleNotif()">${off?'Desligado':'Ligado'}</button></div><button class="btn s o" onclick="sendSummary()">Enviar resumo do m\u00eas</button>${p==='default'?'<button class="btn s o" onclick="askNotif()">Ativar notifica\u00e7\u00f5es do celular</button>':''}${p==='framed'?'<p class="m">As notifica\u00e7\u00f5es do celular s\u00f3 funcionam no app instalado pelo seu pr\u00f3prio endere\u00e7o, n\u00e3o neste link do Claude.</p>':''}${p==='unsupported'?'<p class="m">Para ativar as notifica\u00e7\u00f5es, instale o app na Tela de In\u00edcio e abra pelo \u00edcone.</p>':''}${p==='denied'?'<p class="m">As notifica\u00e7\u00f5es do celular est\u00e3o bloqueadas nos Ajustes do iPhone.</p>':''}</div>`}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render(1);
initSync();
</script>
